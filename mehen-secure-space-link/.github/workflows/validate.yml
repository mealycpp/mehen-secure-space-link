name: Validate package syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax checks
        run: |
          find . -name "*.sh" -print0 | xargs -0 -r -n1 bash -n
      - name: Python compile checks
        run: |
          python3 -m py_compile $(find . -name "*.py")
